name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # WPF, DPAPI et le Desktop exigent Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build .NET
        run: dotnet build "AFMI Smart Admin.sln" --configuration Release

      - name: Tests Core (règles financières, migrations, audit)
        run: dotnet test Core.Tests --configuration Release --no-build

      - name: Tests Desktop
        run: dotnet test Desktop.Tests --configuration Release --no-build

      - name: Migrations à jour
        run: |
          dotnet tool install --global dotnet-ef --version 9.0.8
          dotnet ef migrations has-pending-model-changes --project Core

      - name: OCR local (Tesseract + français) pour les tests des relevés
        continue-on-error: true   # sans Tesseract, les tests OCR sont sautés (les autres s'exécutent)
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          $tessdata = "C:\Program Files\Tesseract-OCR\tessdata"
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/fra.traineddata" -OutFile "$tessdata\fra.traineddata"
          "AFMI_TESSERACT=C:\Program Files\Tesseract-OCR\tesseract.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Tests backend Python
        working-directory: SmartOffice
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest tests -q -p no:cacheprovider

      - name: Build frontend
        working-directory: SmartOffice/frontend
        run: |
          npm ci
          npm run build
